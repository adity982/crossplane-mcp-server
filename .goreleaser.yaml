version: 2

project_name: crossplane-mcp-server

before:
  hooks:
    - go mod tidy

builds:
  - id: crossplane-mcp-server
    main: ./cmd/crossplane-mcp-server
    binary: crossplane-mcp-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ravibagri5/crossplane-mcp-server/pkg/version.Version={{ .Version }}
      - -X github.com/ravibagri5/crossplane-mcp-server/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/ravibagri5/crossplane-mcp-server/pkg/version.BuildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

dockers:
  - image_templates:
      - ghcr.io/ravibagri5/crossplane-mcp-server:{{ .Version }}-amd64
      - ghcr.io/ravibagri5/crossplane-mcp-server:latest-amd64
    # GoReleaser's build context holds only the compiled binaries, so the
    # root Dockerfile, which builds from source, cannot be used here.
    dockerfile: Dockerfile.release
    use: buildx
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}
  - image_templates:
      - ghcr.io/ravibagri5/crossplane-mcp-server:{{ .Version }}-arm64
      - ghcr.io/ravibagri5/crossplane-mcp-server:latest-arm64
    dockerfile: Dockerfile.release
    use: buildx
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}

docker_manifests:
  - name_template: ghcr.io/ravibagri5/crossplane-mcp-server:{{ .Version }}
    image_templates:
      - ghcr.io/ravibagri5/crossplane-mcp-server:{{ .Version }}-amd64
      - ghcr.io/ravibagri5/crossplane-mcp-server:{{ .Version }}-arm64
  - name_template: ghcr.io/ravibagri5/crossplane-mcp-server:latest
    image_templates:
      - ghcr.io/ravibagri5/crossplane-mcp-server:latest-amd64
      - ghcr.io/ravibagri5/crossplane-mcp-server:latest-arm64

# Homebrew publishing is not configured. To add it, create a
# ravibagri5/homebrew-tap repository, give the release workflow a token with
# write access to it, and use homebrew_casks. The older brews section is
# deprecated: https://goreleaser.com/deprecations#brews

changelog:
  use: github
  sort: asc
  groups:
    - title: Added
      regexp: '^.*?(feat|add)(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixed
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: true
  prerelease: auto
  footer: |
    **Full changelog**: https://github.com/ravibagri5/crossplane-mcp-server/compare/{{ .PreviousTag }}...{{ .Tag }}
