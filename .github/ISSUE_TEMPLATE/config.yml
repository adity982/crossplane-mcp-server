blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/ravibagri5/crossplane-mcp-server/security/advisories/new
    about: Report a security issue privately. Please do not open a public issue.
  - name: Question or help
    url: https://github.com/ravibagri5/crossplane-mcp-server/discussions/categories/q-a
    about: Ask how something works. Maintainers convert real bugs into issues.
  - name: Idea or suggestion
    url: https://github.com/ravibagri5/crossplane-mcp-server/discussions/categories/ideas
    about: Float an idea before filing an issue, so we can agree on the shape.
  - name: Show and tell
    url: https://github.com/ravibagri5/crossplane-mcp-server/discussions/categories/show-and-tell
    about: Share a workflow, a prompt or a transcript that worked well.
  - name: Roadmap
    url: https://github.com/ravibagri5/crossplane-mcp-server/blob/main/ROADMAP.md
    about: Check whether what you want is already planned before opening anything.
  - name: Crossplane Slack
    url: https://slack.crossplane.io
    about: Chat with the Crossplane community. Find us in #crossplane.
