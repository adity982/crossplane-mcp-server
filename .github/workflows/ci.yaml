name: CI

on:
  push:
    branches: [main, develop, "release/**"]
    # Prose cannot break the build, and the badge still reflects the last
    # commit that touched code.
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be at least the go directive in go.mod, which k8s.io/client-go
  # holds at 1.26.
  GO_VERSION: "1.27"

jobs:
  verify:
    name: Verify generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "::error::go.mod or go.sum is not tidy, run 'make tidy'" && exit 1)

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not formatted, run 'make fmt':"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with a Go at least as new as the go directive in
          # go.mod, otherwise golangci-lint refuses to load the config.
          version: v2.13.2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The race detector roughly triples the run, so it guards Linux,
          # which is what the container image and most deployments run. The
          # other platforms are here to catch path and filesystem assumptions,
          # which a plain run finds just as well.
          - os: ubuntu-latest
            flags: -race -coverprofile=coverage.out -covermode=atomic
          - os: macos-latest
            flags: ""
          - os: windows-latest
            flags: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        # PowerShell mangles the -coverprofile=coverage.out argument, so pin
        # every runner to bash for consistency. go vet is not run here: the
        # lint job's standard linter set already includes it.
        run: go test -count=1 ${{ matrix.flags }} ./...
        shell: bash

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: make build

      - name: Smoke test
        run: |
          ./bin/crossplane-mcp-server --version
          # `tools` never touches a cluster, so it is a real check that every
          # toolset registered and every tool is well formed.
          ./bin/crossplane-mcp-server tools

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        # govulncheck tracks the Go tip release, so let the module toolchain
        # directive fetch a newer Go than setup-go pinned.
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: crossplane-mcp-server:ci
          # The GitHub Actions cache service intermittently rejects blob
          # writes. Caching is an optimisation here, so never fail the job
          # over it, and only cache the final layers rather than every stage.
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
