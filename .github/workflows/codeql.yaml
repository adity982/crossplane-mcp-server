name: CodeQL

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]
  schedule:
    # Weekly, so that a newly published CodeQL rule finds old code too.
    - cron: "27 4 * * 1"

permissions:
  contents: read

# Two runs for one commit both try to upload SARIF for the same category and
# the loser fails, which looks like a scan failure rather than a duplicate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # A job level block replaces the workflow level one rather than adding to
      # it, so contents has to be repeated here or checkout runs unauthenticated.
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
