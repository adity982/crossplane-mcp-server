version: "2"

run:
  timeout: 5m

linters:
  default: standard
  # goconst is deliberately absent. This server exists to emit JSON payloads
  # and render tables, so repeated literals such as "count", "namespace" and
  # "AGE" are data rather than magic values, and hoisting them into constants
  # makes the tool schemas and table headers harder to read.
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    revive:
      rules:
        # Exported identifiers carry the documentation for anyone embedding
        # this module, so keep the comments honest.
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: package-comments
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: context-as-argument
        - name: unexported-return

    gocritic:
      disabled-checks:
        - ifElseChain

  exclusions:
    rules:
      # Tests are allowed to be repetitive and to skip the doc comments.
      - path: _test\.go
        linters:
          - revive
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ravibagri5/crossplane-mcp-server

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
